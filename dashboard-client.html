<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Espace - Teranga Palace</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header" id="main-header">
        <div class="logo">
            <a href="index.html">
                <img src="assetes/logo_teranga_palace.png" alt="Teranga Palace" class="logo-img">
            </a>
        </div>
        <button class="nav-toggle" id="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav" id="main-nav">
            <a href="index.html" class="nav-link">Accueil</a>
            <a href="chambres.html" class="nav-link">Chambres</a>
            <a href="dashboard-client.html" id="dashboard-btn-nav" class="nav-link"
                style="color: var(--color-primary);">Mon Espace</a>
            <a href="#" id="logout-btn-nav" class="btn btn-primary" onclick="handleLogout(event)">Déconnexion</a>
        </nav>
    </header>

    <main class="dashboard-container">
        <div class="dashboard-header">
            <div>
                <h1>Mon Espace Client</h1>
                <p>Bienvenue, <span id="client-name">Chargement...</span></p>
            </div>
            <a href="chambres.html" class="btn btn-primary">Nouvelle réservation</a>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('reservations', event)">Mes Réservations</button>
            <button class="tab-btn" onclick="switchTab('sejours', event)">Mes Séjours</button>
            <button class="tab-btn" onclick="switchTab('factures', event)">Mes Factures</button>
        </div>

        <div id="alert-container" class="alert hidden"></div>

        <!-- Section Réservations -->
        <section id="tab-reservations" class="tab-content active">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Date de création</th>
                        <th>Chambre</th>
                        <th>Arrivée</th>
                        <th>Départ</th>
                        <th>Statut</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="reservations-list">
                    <tr>
                        <td colspan="6" style="text-align: center;">Chargement...</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Section Séjours -->
        <section id="tab-sejours" class="tab-content">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Chambre</th>
                        <th>Arrivée</th>
                        <th>Départ</th>
                        <th>Montant Total</th>
                    </tr>
                </thead>
                <tbody id="sejours-list">
                    <tr>
                        <td colspan="4" style="text-align: center;">Chargement...</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Section Factures -->
        <section id="tab-factures" class="tab-content">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>N° Facture</th>
                        <th>Date</th>
                        <th>Montant</th>
                        <th>Statut</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="factures-list">
                    <tr>
                        <td colspan="5" style="text-align: center;">Chargement...</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <!-- Scripts -->
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard-client.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
