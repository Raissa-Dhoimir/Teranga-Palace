<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription - Teranga Palace</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Page transition -->
    <style>
        body {
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        body.loaded {
            opacity: 1;
        }

        .nav-link.active {
            color: var(--color-primary);
        }
    </style>
</head>

<body class="auth-body">

    <!-- Header de navigation -->
    <header class="header"
        style="position:relative;z-index:10;background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.2);">
        <div class="logo">
            <a href="index.html" onclick="navigateTo(event,'index.html')"
                style="color:#fff;font-weight:700;font-size:1.1rem;">
                <img src="assetes/logo_teranga_palace.png" alt="Teranga Palace" class="logo-img">
            </a>
        </div>
        <nav class="nav">
            <a href="index.html" class="nav-link" style="color:rgba(255,255,255,0.85);"
                onclick="navigateTo(event,'index.html')">Accueil</a>
            <a href="chambres.html" class="nav-link" style="color:rgba(255,255,255,0.85);"
                onclick="navigateTo(event,'chambres.html')">Chambres</a>
            <span class="btn btn-primary" style="opacity:0.7;cursor:default;">Connexion / Inscription</span>
        </nav>
    </header>
    <div class="auth-container">
        <!-- Glassmorphism Card -->
        <div class="auth-card glassmorphism">
            <div class="auth-header">
                <h2>Teranga Palace</h2>
                <p id="auth-subtitle">Connectez-vous à votre compte</p>
            </div>

            <div id="alert-container" class="alert hidden"></div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="votre@email.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Mot de passe</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Se connecter</button>
                <p class="auth-toggle">Pas de compte ? <a href="#" onclick="toggleAuthMode(event)">S'inscrire</a></p>
                <div class="auth-home-link">
                    <a href="index.html">← Retour à l'accueil</a>
                </div>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form hidden-form">
                <div class="form-group">
                    <label for="reg-nom">Nom</label>
                    <input type="text" id="reg-nom" required placeholder="Votre nom">
                </div>
                <div class="form-group">
                    <label for="reg-prenom">Prénom</label>
                    <input type="text" id="reg-prenom" required placeholder="Votre prénom">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required placeholder="votre@email.com">
                </div>
                <div class="form-group">
                    <label for="reg-password">Mot de passe</label>
                    <input type="password" id="reg-password" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="reg-role">Rôle (Démo)</label>
                    <select id="reg-role">
                        <option value="client">Client</option>
                        <option value="admin">Administrateur</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Créer un compte</button>
                <p class="auth-toggle">Déjà un compte ? <a href="#" onclick="toggleAuthMode(event)">Se connecter</a></p>
                <div class="auth-home-link">
                    <a href="index.html">← Retour à l'accueil</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Configuration Supabase -->
    <script src="js/supabase-config.js"></script>
    <!-- Logique d'authentification -->
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('loaded');
        });
        function navigateTo(e, url) {
            e.preventDefault();
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.35s ease';
            setTimeout(() => { window.location.href = url; }, 350);
        }
    </script>
</body>

</html>
